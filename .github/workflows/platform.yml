name: MathS-Agent dev Docker startup
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maths-dev-docker
  cancel-in-progress: false
jobs:
  startup:
    if: github.ref == 'refs/heads/dev'
    runs-on: ${{ fromJSON(vars.MATHS_RUNNER_LABELS || '["self-hosted"]') }}
    environment: dev
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: maths-dev-check
      COMPOSE_FILE: ${{ vars.MATHS_USE_GPU == 'true' && 'compose.web.yaml:compose.web.gpu.yaml' || 'compose.web.yaml' }}
      # Do not read a runner-local .env file.
      COMPOSE_ENV_FILES: /dev/null
      MATHS_IMAGE_TAG: dev-check
      NODE_IMAGE: ${{ vars.NODE_IMAGE || 'node:24.11.1-bookworm-slim' }}
      PYTHON_IMAGE: ${{ vars.PYTHON_IMAGE || 'python:3.11.13-slim' }}
      PIP_INDEX_URL: ${{ vars.PIP_INDEX_URL || 'https://pypi.tuna.tsinghua.edu.cn/simple' }}
      NPM_REGISTRY: ${{ vars.NPM_REGISTRY || 'https://registry.npmmirror.com' }}
      TORCH_INDEX_URL: ${{ vars.TORCH_INDEX_URL || (vars.MATHS_USE_GPU == 'true' && 'https://mirror.sjtu.edu.cn/pytorch-wheels/cu128' || 'https://mirror.sjtu.edu.cn/pytorch-wheels/cpu') }}
      MATHS_MODEL_DIR: ${{ vars.MATHS_MODEL_DIR }}
      MATHS_WEB_BIND: 127.0.0.1
      MATHS_WEB_PORT: ${{ vars.MATHS_WEB_PORT || '18010' }}
      MATHS_STARTUP_TIMEOUT: ${{ vars.MATHS_STARTUP_TIMEOUT || '180' }}
      INTERN_API_KEY: ${{ secrets.INTERN_API_KEY }}
      INTERN_API_BASE: ${{ vars.INTERN_API_BASE }}
      INTERN_MODEL: ${{ vars.INTERN_MODEL || 'intern-s2-preview' }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
      LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'math-reasoning-dev' }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT || 'https://api.smith.langchain.com' }}
      STAGED_STRATEGY_RETRIEVAL_ENABLED: ${{ vars.STAGED_STRATEGY_RETRIEVAL_ENABLED || 'true' }}
      STAGED_STRATEGY_RETRIEVAL_MODE: ${{ vars.STAGED_STRATEGY_RETRIEVAL_MODE || 'hybrid' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The runner's model directory is mounted instead of downloading LFS weights.
          lfs: false
          clean: false
          persist-credentials: false
      - name: 构建 Web 和 LangGraph 镜像（不含模型）
        run: docker compose build web
      - name: 启动并等待健康检查
        run: docker compose up -d --no-build --wait --wait-timeout "$MATHS_STARTUP_TIMEOUT" web
      - name: 查看容器运行日志
        if: always()
        run: docker compose logs --no-color --tail 200 web
      - name: 关闭本次检查容器（保留数据卷）
        if: always()
        run: docker compose down
